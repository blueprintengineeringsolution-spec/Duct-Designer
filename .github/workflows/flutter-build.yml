name: Build APK File

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v3
        with:
          channel: stable

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build release APK
        shell: bash
        run: |
          set +e
          flutter build apk --release --no-shrink 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            echo "########## DIAGNOSIS ##########"
            echo "--- files in android/app ---"
            ls android/app
            echo "--- where the Flutter plugin is applied ---"
            grep -rn "flutter-gradle-plugin\|flutter-plugin-loader\|generateLockfiles" android --include=*.kts --include=*.gradle
            echo "--- real error ---"
            grep -n -B 8 -A 6 "What went wrong" build.log | head -40
          fi
          exit $code

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7