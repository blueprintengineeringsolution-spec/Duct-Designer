name: Build APK File

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v3
        with:
          channel: stable

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build release APK
        shell: bash
        run: |
          flutter build apk --release --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Show real error (last step)
        if: failure()
        shell: bash
        run: |
          echo "########## REAL ERROR ##########"
          grep -n -A 20 "What went wrong" build.log | head -60
          echo "########## CAUSED BY ##########"
          grep -n "Caused by" build.log | head -10
          echo "########## android.* settings ##########"
          cat android/gradle.properties